// wrosbridge.v1 health service.
// Gateway의 생명주기 상태를 외부에서 확인하기 위한 최소 health check API.
syntax = "proto3";

package wrosbridge.v1;

option go_package = "wrosbridge/v1;wrosbridgev1";

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  // 비어 있으면 전체 서비스 상태를 조회한다.
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
