syntax = "proto3";

package wrosbridge.v1;

import "google/protobuf/duration.proto";
import "wrosbridge/v1/common.proto";

option go_package = "wrosbridge/v1;wrosbridgev1";

// SRV-001: ROS2 서비스 호출을 위한 gRPC 서비스 인터페이스.
service ServiceService {
  // Unary gRPC 호출을 ROS2 Service Client로 디스패치하고 결과를 반환합니다.
  rpc CallService(ServiceRequest) returns (ServiceResponse);
}

// 서비스 호출 요청 메시지.
message ServiceRequest {
  // 대상 ROS2 서비스 이름 (예: "/robot/set_mode", "/add_two_ints")
  string service = 1;

  // ROS2 서비스 타입 (예: "std_srvs/srv/SetBool", "example_interfaces/srv/AddTwoInts")
  string type = 2;

  // ROS2 CDR 직렬화된 서비스 Request 페이로드 바이너리
  bytes payload = 3;

  // 선택적 클라이언트 지정 타임아웃 (gRPC context deadline과 함께 평가됨)
  optional google.protobuf.Duration timeout = 4;

  // 선택적 헤더 메타데이터
  optional Header header = 5;
}

// 서비스 호출 응답 메시지.
message ServiceResponse {
  // 호출된 ROS2 서비스 이름
  string service = 1;

  // ROS2 서비스 타입
  string type = 2;

  // ROS2 CDR 직렬화된 서비스 Response 페이로드 바이너리
  bytes payload = 3;

  // 서비스 호출 성공 여부
  bool success = 4;

  // 오류 발생 시 오류 상세 메시지
  string error_message = 5;

  // 선택적 응답 헤더 메타데이터
  optional Header header = 6;
}
